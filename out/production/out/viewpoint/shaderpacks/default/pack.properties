name=Default
author=Viewpoint
description=Vivid's look, going further: sunlight in the sun's colour over shade cooled by the sky, the sky as the \
  earth's air scatters the sun's light, red at sunset, with the stars and the moon by night, fog in the sky's own \
  colour, clouds that shade the ground and glow at sunset, light shafts, soft shadows, bloom as a soft haze, a filmic \
  tone curve, a lens flare, depth of field and motion blur.
base=vivid
pipeline.atmosphere=true
pipeline.eye=true
pipeline.froxels=true
pipeline.froxelSteps=${volumetricSteps}
pipeline.sunShafts=${sunShafts}
pipeline.cloudShadowMap=true
pipeline.reflections=${reflections}
pipeline.reflectionClouds=${cloudReflections}
pipeline.rainGround=true
pipeline.floorSurfaces=${groundMaterials}
pipeline.wallSurfaces=${wallMaterials}
pipeline.water=true
pipeline.waterFft=${fftWaves}

dropOptions=aurora
options=contrast highClouds nightColour toneCurve sunShafts reflections cloudReflections fftWaves waterReach \
  groundMaterials wallMaterials
option.contrast.label=Contrast
option.contrast.tooltip=How steep the tone curve is: deeper shadows and brighter highlights.
option.contrast.range=0.7 1.6 0.05
option.contrast.default=1

option.sunShafts.label=Sun shafts
option.sunShafts.tooltip=Shows rays of sunlight that go past roofs, trees, poles, people and clouds in front of the sun.
option.sunShafts.default=true
option.sunShafts.preset.potato=false
option.sunShafts.preset.low=false

option.highClouds.label=High clouds
option.highClouds.tooltip=The clouds above the low ones, as Horizon Forbidden West draws them: cirrus and veils high up, \
  altocumulus lower, each drifting on the wind at its height. Textured: from images. Procedural: from the clouds' noise.
option.highClouds.values=textured procedural
option.highClouds.default=textured

option.nightColour.label=Night colour shift
option.nightColour.tooltip=How far the night turns blue and grey as your eyes adapt to the dark, while lamps keep their \
  colour (1: as the eye's rods do it, 0: none).
option.nightColour.range=0 2 0.05
option.nightColour.default=1

option.toneCurve.label=Tone curve
option.toneCurve.tooltip=How the scene's light becomes the screen's. Filmic: vivid's, with contrast. Neutral: Khronos PBR \
  Neutral, colours as the art has them. Tony: Tony McMapface, soft and natural, the brightest going white as the eye \
  sees them. Uncharted 2: John Hable's film curve from Uncharted 2, a long soft roll into white, bright colours paler.
option.toneCurve.values=filmic neutral tony uncharted
option.toneCurve.value.filmic=Filmic
option.toneCurve.value.neutral=Neutral
option.toneCurve.value.tony=Tony
option.toneCurve.value.uncharted=Uncharted 2
option.toneCurve.default=filmic

option.reflections.label=Reflections
option.reflections.tooltip=Water, puddles and car paint show what is around them. Off: they show only the sky. Medium: from \
  one pixel in sixteen. High: from one pixel in four. Ultra: from the same pixels, further along each ray. Extreme: \
  from every pixel.
option.reflections.values=off low medium high ultra
option.reflections.value.off=Off
option.reflections.value.low=Medium
option.reflections.value.medium=High
option.reflections.value.high=Ultra
option.reflections.value.ultra=Extreme
option.reflections.default=high
option.reflections.preset.potato=off
option.reflections.preset.low=low
option.reflections.preset.ultra=ultra

option.cloudReflections.label=Clouds in reflections
option.cloudReflections.tooltip=Reflections show the clouds when they reflect the sky above the screen.
option.cloudReflections.default=false
option.cloudReflections.preset.high=true
option.cloudReflections.preset.ultra=true

option.fftWaves.label=Moving waves
option.fftWaves.tooltip=The waves on rivers and lakes change each moment. Off: one pattern of waves moves across the water.
option.fftWaves.default=false
option.fftWaves.preset.high=true
option.fftWaves.preset.ultra=true

option.waterReach.label=Water shading reach
option.waterReach.tooltip=How far the water has waves, reflections and depth. Loaded: only the area near you. \
  Shells: also the nearer distant land. All: also the farthest distant land. The other water shows its map colour.
option.waterReach.values=loaded shells all
option.waterReach.default=shells
option.waterReach.preset.potato=loaded
option.waterReach.preset.low=loaded
option.waterReach.preset.high=all
option.waterReach.preset.ultra=all

option.groundMaterials.label=Ground materials
option.groundMaterials.tooltip=The ground has the relief and the shine of what it is made of: grass and soil rough and \
  uneven, asphalt with its stones, tiles glazed between their grout lines, wood smooth. Off: every floor is flat and \
  equally rough.
option.groundMaterials.default=true
option.groundMaterials.preset.potato=false

option.wallMaterials.label=Wall materials
option.wallMaterials.tooltip=The walls have the relief and the shine of what they are made of: brick and stone rough \
  between their mortar lines, siding in its boards, a bathroom's tiles glazed, a garage door's metal smooth. Off: every \
  wall is flat and equally rough.
option.wallMaterials.default=true
option.wallMaterials.preset.potato=false
