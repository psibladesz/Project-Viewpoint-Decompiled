name=Vivid
author=Viewpoint
description=The full look, warmer and bolder: sunlight in the sun's colour over shade cooled by the sky, lights that \
  combine softly, faces shaded by their direction, a sky that burns orange where the sun sets and glares about the \
  sun and moon, a thicker fog in the sky's own colour, clouds that shade the ground, light shafts at their strongest at \
  sunset, soft-edged shadows, bloom as a soft haze, a filmic tone curve with contrast, saturation and vibrance, \
  a lens flare, depth of field and motion blur.
base=library

options=exposure contrast saturation vibrance shadowSamples occlusion occlusionQuality bounceLight volumetricSteps cloudStyle cloudSteps nebula \
  aurora lensFlare lensFlareStrength depthOfField dofStrength dofSamples focusSpeed motionBlur motionBlurStrength \
  motionBlurSamples

option.exposure.label=Exposure
option.exposure.tooltip=How bright the image is before the tone curve.
option.exposure.range=0.5 2 0.05
option.exposure.default=1

option.contrast.label=Contrast
option.contrast.tooltip=How steep the tone curve is: deeper shadows and brighter highlights.
option.contrast.range=0.7 1.6 0.05
option.contrast.default=1.25

option.saturation.label=Saturation
option.saturation.tooltip=How strong every colour is (1: as lit).
option.saturation.range=0 2 0.05
option.saturation.default=1

option.vibrance.label=Vibrance
option.vibrance.tooltip=How much the dull colours are strengthened, leaving the strong ones as they are.
option.vibrance.range=0 1 0.05
option.vibrance.default=0.25

option.shadowSamples.label=Shadow samples
option.shadowSamples.tooltip=Taps per point in the sun's shadow filter: softer, smoother shadow edges for more time.
option.shadowSamples.values=4 8 12 16
option.shadowSamples.default=8
option.shadowSamples.preset.potato=4
option.shadowSamples.preset.low=4
option.shadowSamples.preset.high=12
option.shadowSamples.preset.ultra=16

option.volumetricSteps.label=Volumetric quality (steps)
option.volumetricSteps.tooltip=Steps along each ray through the air: smoother light for more time.
option.volumetricSteps.values=12 16 24 32 48
option.volumetricSteps.default=16
option.volumetricSteps.preset.potato=12
option.volumetricSteps.preset.low=12
option.volumetricSteps.preset.high=32
option.volumetricSteps.preset.ultra=48

option.cloudSteps.label=Cloud samples
option.cloudSteps.tooltip=Samples along each view ray through the clouds towards the horizon, half as many \
  overhead: smoother, finer clouds for more time.
option.cloudSteps.values=20 30 40 60 80
option.cloudSteps.default=30
option.cloudSteps.preset.potato=20
option.cloudSteps.preset.low=20
option.cloudSteps.preset.high=60
option.cloudSteps.preset.ultra=80

option.occlusion.label=Ambient occlusion
option.occlusion.tooltip=The shade in corners, in creases and under things, where less of the light from all round \
  reaches (XeGTAO's ground-truth occlusion).
option.occlusion.default=true
option.occlusion.preset.potato=false
option.occlusion.preset.low=false

option.occlusionQuality.label=Ambient occlusion quality
option.occlusionQuality.tooltip=Directions and steps taken round each pixel, as XeGTAO's presets a step down: Medium \
  (1 x 2) is about half Ultra's time (3 x 3), High (2 x 2) two thirds; Extreme (9 x 3) the least noise for about twice \
  Ultra's.
option.occlusionQuality.values=low medium high ultra
option.occlusionQuality.value.low=Medium
option.occlusionQuality.value.medium=High
option.occlusionQuality.value.high=Ultra
option.occlusionQuality.value.ultra=Extreme
option.occlusionQuality.default=medium
option.occlusionQuality.preset.potato=low
option.occlusionQuality.preset.low=low
option.occlusionQuality.preset.high=high
option.occlusionQuality.preset.ultra=ultra

option.bounceLight.label=Global illumination
option.bounceLight.tooltip=The light the lit floors round about bounce onto walls, ceilings and things, and the light \
  the flashlight's beam bounces back from where it lands.
option.bounceLight.default=true
option.bounceLight.preset.potato=false
option.bounceLight.preset.low=false

option.cloudStyle.label=Cloud style
option.cloudStyle.tooltip=Soft: volumetric clouds. Layered: a thin layer of blocks. Either shades the ground.
option.cloudStyle.values=soft layered
option.cloudStyle.default=soft

option.nebula.label=Nebula
option.nebula.tooltip=A faint band of coloured cloud across the night sky.
option.nebula.default=false

option.aurora.label=Aurora
option.aurora.tooltip=Curtains of green light in the northern night sky.
option.aurora.default=false

option.lensFlare.label=Lens flare
option.lensFlare.tooltip=Ghosts, a halo and a starburst where the sun and the brightest lights shine into the view, as \
  a camera's lens makes them.
option.lensFlare.default=true
option.lensFlare.preset.potato=false
option.lensFlare.preset.low=false

option.lensFlareStrength.label=Lens flare strength
option.lensFlareStrength.tooltip=How bright the flare is.
option.lensFlareStrength.range=0.1 2 0.05
option.lensFlareStrength.default=1

option.depthOfField.label=Depth of field
option.depthOfField.tooltip=What lies past the surface under the crosshair blurs, more the nearer that surface is, as a \
  lens focuses. Nearer things, your own hands among them, stay sharp.
option.depthOfField.default=false
option.depthOfField.preset.high=true
option.depthOfField.preset.ultra=true

option.dofStrength.label=Depth of field strength
option.dofStrength.tooltip=How wide the lens is open: a stronger blur, and a shallower sharp zone.
option.dofStrength.range=0.1 1 0.05
option.dofStrength.default=0.1

option.dofSamples.label=Depth of field samples
option.dofSamples.tooltip=Taps in each blurred pixel: a smoother blur for more time.
option.dofSamples.values=16 24 40
option.dofSamples.default=24
option.dofSamples.preset.potato=16
option.dofSamples.preset.low=16
option.dofSamples.preset.ultra=40

option.focusSpeed.label=Focus time
option.focusSpeed.tooltip=Seconds the focus takes to settle on a new distance (about two thirds of the way).
option.focusSpeed.range=0.05 1 0.05
option.focusSpeed.default=0.3

option.motionBlur.label=Motion blur
option.motionBlur.tooltip=Blur along the motion on screen as the view turns and as things move, as a camera's shutter \
  would: moving things streak over what is still behind them.
option.motionBlur.default=true
option.motionBlur.preset.potato=false
option.motionBlur.preset.low=false

option.motionBlurStrength.label=Motion blur strength
option.motionBlurStrength.tooltip=How long the shutter stays open, as a share of a frame: longer streaks.
option.motionBlurStrength.range=0.1 1 0.05
option.motionBlurStrength.default=0.5

option.motionBlurSamples.label=Motion blur samples
option.motionBlurSamples.tooltip=Taps along each streak: smoother streaks for more time.
option.motionBlurSamples.values=4 6 10 16
option.motionBlurSamples.default=6
option.motionBlurSamples.preset.high=10
option.motionBlurSamples.preset.ultra=16

targets=flare focus motionTiles
target.flare=rgba16f 0.5
target.focus=r16f 1x1 history
target.motionTiles=rg16f 0.0625

passes=flare focus depthOfField motionTiles motionBlur flareAdd
pass.flare.stage=composite
pass.flare.fragment=flare.frag
pass.flare.inputs=color depth farDepth
pass.flare.target=flare
pass.flare.when=lensFlare

pass.focus.stage=final
pass.focus.fragment=focus.frag
pass.focus.inputs=depth focus.previous
pass.focus.target=focus
pass.focus.when=depthOfField

pass.depthOfField.stage=final
pass.depthOfField.fragment=dof.frag
pass.depthOfField.inputs=color depth focus
pass.depthOfField.when=depthOfField

pass.flareAdd.stage=final
pass.flareAdd.fragment=flare_add.frag
pass.flareAdd.inputs=color flare
pass.flareAdd.when=lensFlare
pass.motionTiles.stage=final
pass.motionTiles.fragment=motion_tiles.frag
pass.motionTiles.inputs=depth velocity
pass.motionTiles.target=motionTiles
pass.motionTiles.when=motionBlur

pass.motionBlur.stage=final
pass.motionBlur.fragment=motion_blur.frag
pass.motionBlur.inputs=color depth velocity motionTiles
pass.motionBlur.when=motionBlur
