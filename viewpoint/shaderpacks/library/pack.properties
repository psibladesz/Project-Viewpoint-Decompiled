name=Library
author=Viewpoint
description=The full look: sun shadows through up to three cascades, per-pixel lamps with shadows from the \
  nearest, a shadowed flashlight, bounce light, volumetric light with god rays, clouds, rain and puddles, glowing far \
  lamps, bloom and TAA.

options=sunShadows shadowResolution shadowCascades flashlightShadow lampShadows lampShadowResolution headlightShadows \
  farShadows \
  farLamps volumetrics godrays volumetricSteps clouds cloudResolution cloudSteps softClouds occlusion \
  occlusionQuality \
  occlusionRadius occlusionStrength bounceLight bounceStrength bounceReach flashBounce bloom antialiasing upscaling \
  renderScale puddles rainDensity

option.sunShadows.label=Sun shadows
option.sunShadows.tooltip=The sun's and the moon's shadows from the near world.
option.sunShadows.default=true
option.sunShadows.preset.potato=false

option.shadowResolution.label=Shadow resolution
option.shadowResolution.tooltip=Texels a side of each sun cascade: sharper shadows for more video memory and time.
option.shadowResolution.values=1024 2048 4096 8192
option.shadowResolution.default=2048
option.shadowResolution.preset.potato=1024
option.shadowResolution.preset.high=4096
option.shadowResolution.preset.ultra=8192

option.shadowCascades.label=Shadow cascades
option.shadowCascades.tooltip=Sun shadows out to 22 squares with one cascade, 64 with two, the end of the fog with three.
option.shadowCascades.values=1 2 3
option.shadowCascades.default=3
option.shadowCascades.preset.potato=1
option.shadowCascades.preset.low=2

option.flashlightShadow.label=Flashlight and muzzle flash shadows
option.flashlightShadow.tooltip=What the flashlight's beam falls on casts a shadow (a shadow map of its own). When a gun   fires, what stands near it casts a shadow from the muzzle flash (six shadow maps, only while the flash shows).
option.flashlightShadow.default=true
option.flashlightShadow.preset.potato=false

option.lampShadows.label=Lamp shadows (nearest lamps)
option.lampShadows.tooltip=How many of the nearest lamps cast shadows: what stands in a street light's or a lamp's \
  light (people, cars, furniture, fences) darkens what lies behind it. Each is a cube of shadow maps. Lamps standing \
  together (a crossing's) cast as a group, so their shadows do not jump from lamp to lamp as you walk.
option.lampShadows.values=0 2 4 6 8
option.lampShadows.default=2
option.lampShadows.preset.potato=0
option.lampShadows.preset.low=2
option.lampShadows.preset.high=6
option.lampShadows.preset.ultra=8

option.lampShadowResolution.label=Lamp shadow resolution
option.lampShadowResolution.tooltip=Texels a side of each face of a lamp's shadow cube: sharper lamp shadows for more \
  video memory and time.
option.lampShadowResolution.values=256 512 1024
option.lampShadowResolution.default=512
option.lampShadowResolution.preset.potato=256
option.lampShadowResolution.preset.low=256
option.lampShadowResolution.preset.ultra=1024

option.headlightShadows.label=Headlight shadows (nearest cars)
option.headlightShadows.tooltip=How many of the nearest cars' headlights cast shadows: what stands in a car's beams \
  (people, zombies, other cars, fences) darkens the road behind it, and its beams in the air are cut by it. Your own \
  car first; a car further off has a smaller shadow map, drawn less often.
option.headlightShadows.values=0 1 2 4
option.headlightShadows.default=1
option.headlightShadows.preset.potato=0
option.headlightShadows.preset.low=0
option.headlightShadows.preset.high=2
option.headlightShadows.preset.ultra=4

option.farShadows.label=Far world shadows
option.farShadows.tooltip=The sun's shadows past the loaded chunks, out to the fog: the far world's buildings and trees, \
  and the near world's, cast onto each other.
option.farShadows.default=true
option.farShadows.preset.potato=false
option.farShadows.preset.low=false

option.farLamps.label=Far lamps
option.farLamps.tooltip=Street lights and outdoor lamps past the loaded chunks shine as small glowing points at night.
option.farLamps.default=true

option.volumetrics.label=Volumetric light
option.volumetrics.tooltip=Light in the air: haze over distance, lamp halos, the flashlight's beam, dust indoors.
option.volumetrics.default=true
option.volumetrics.preset.potato=false
option.volumetrics.preset.low=false

option.godrays.label=God rays
option.godrays.tooltip=The sun's shafts through the volumetric light, cut by what stands in them.
option.godrays.default=true
option.godrays.preset.potato=false
option.godrays.preset.low=false

option.volumetricSteps.label=Volumetric quality (steps)
option.volumetricSteps.tooltip=Steps along each ray through the air: smoother light for more time.
option.volumetricSteps.values=12 16 24 32 48
option.volumetricSteps.default=24
option.volumetricSteps.preset.potato=12
option.volumetricSteps.preset.low=12
option.volumetricSteps.preset.high=32
option.volumetricSteps.preset.ultra=48

option.clouds.label=Clouds
option.clouds.tooltip=Volumetric clouds in the sky.
option.clouds.default=true
option.clouds.preset.potato=false

option.cloudResolution.label=Cloud resolution
option.cloudResolution.tooltip=How finely the clouds are drawn, as a share of the screen's resolution: sharper \
  clouds for more time.
option.cloudResolution.values=25 50 75 100
option.cloudResolution.default=50
option.cloudResolution.preset.potato=25
option.cloudResolution.preset.high=75
option.cloudResolution.preset.ultra=100

option.cloudSteps.label=Cloud samples
option.cloudSteps.tooltip=Samples along each view ray through the clouds towards the horizon, half as many \
  overhead: smoother, finer clouds for more time.
option.cloudSteps.values=20 30 40 60 80
option.cloudSteps.default=40
option.cloudSteps.preset.potato=20
option.cloudSteps.preset.low=30
option.cloudSteps.preset.high=60
option.cloudSteps.preset.ultra=80

option.softClouds.label=Soft clouds
option.softClouds.tooltip=Keeps the clouds as soft as their resolution draws them, steadier as they move, rather \
  than built up sharp over many frames.
option.softClouds.default=false
option.softClouds.preset.potato=true
option.softClouds.preset.low=true

option.occlusion.label=Ambient occlusion
option.occlusion.tooltip=The shade in corners, in creases and under things, where less of the light from all round \
  reaches (XeGTAO's ground-truth occlusion).
option.occlusion.default=true
option.occlusion.preset.potato=false
option.occlusion.preset.low=false

option.occlusionQuality.label=Ambient occlusion quality
option.occlusionQuality.tooltip=Directions and steps taken round each pixel, as XeGTAO's presets a step down: Medium \
  (1 x 2) is about half Ultra's time (3 x 3), High (2 x 2) two thirds; Extreme (9 x 3) the least noise for about twice \
  Ultra's.
option.occlusionQuality.values=low medium high ultra
option.occlusionQuality.value.low=Medium
option.occlusionQuality.value.medium=High
option.occlusionQuality.value.high=Ultra
option.occlusionQuality.value.ultra=Extreme
option.occlusionQuality.default=high
option.occlusionQuality.preset.ultra=ultra

option.occlusionRadius.label=Ambient occlusion radius
option.occlusionRadius.tooltip=How far round a point its occluders are looked for, against the default (about a square \
  and a half): wider, softer shade from larger things.
option.occlusionRadius.range=0.25 3 0.05
option.occlusionRadius.default=1

option.occlusionStrength.label=Ambient occlusion strength
option.occlusionStrength.tooltip=How deep the shade is (1: as XeGTAO matches its ray-traced reference, 0: none).
option.occlusionStrength.range=0 2 0.05
option.occlusionStrength.default=1

option.bounceLight.label=Global illumination
option.bounceLight.tooltip=The light the lit floors round about bounce onto walls, ceilings and things, and the light \
  the flashlight's beam bounces back from where it lands.
option.bounceLight.default=true
option.bounceLight.preset.potato=false
option.bounceLight.preset.low=false

option.bounceStrength.label=Global illumination strength
option.bounceStrength.tooltip=How much light the lit floors round about bounce onto walls, ceilings and things (1: as \
  the light model gives it, 0: none). Only with global illumination on.
option.bounceStrength.range=0 3 0.05
option.bounceStrength.default=1

option.bounceReach.label=Global illumination reach (squares)
option.bounceReach.tooltip=How far a lit floor's light bounces, in squares: a wider, smoother bounce for more time.
option.bounceReach.values=3 6 9 12
option.bounceReach.default=6

option.flashBounce.label=Flashlight global illumination strength
option.flashBounce.tooltip=How much of the flashlight's light the surfaces it lands on bounce back round about (1: as \
  the light model gives it, 0: none). Only with global illumination on.
option.flashBounce.range=0 3 0.05
option.flashBounce.default=1

option.bloom.label=Bloom
option.bloom.tooltip=Bright lights glow over what is around them.
option.bloom.default=true
option.bloom.preset.potato=false

option.antialiasing.label=Anti-aliasing
option.antialiasing.tooltip=Smooths jagged edges. TAA+: each frame blended with the ones before, the steadiest and \
  smoothest. TAA: the same over fewer frames. TAA + FXAA: TAA over frames FXAA has smoothed. SMAA, FXAA: each frame on \
  its own, sharp, edges can still shimmer. Off: none. Off while resolution scaling is on: its upscaler smooths the \
  edges.
option.antialiasing.values=off fxaa smaa taa taaFxaa taaPlus
option.antialiasing.value.off=Off
option.antialiasing.value.fxaa=FXAA
option.antialiasing.value.smaa=SMAA
option.antialiasing.value.taa=TAA
option.antialiasing.value.taaFxaa=TAA + FXAA
option.antialiasing.value.taaPlus=TAA+
option.antialiasing.default=taaPlus
option.antialiasing.disabledBy=upscaling

option.upscaling.label=Resolution scaling
option.upscaling.tooltip=A graphics card maker's upscaler in the anti-aliasing's place: it smooths the edges and \
  brings a render resolution under 100% up to the screen's. FSR 3: AMD's. XeSS: Intel's. DLSS: NVIDIA's, on its RTX \
  cards only; at 100% render resolution DLAA. Off: the anti-aliasing above.
option.upscaling.values=off fsr3 xess dlss
option.upscaling.value.off=Off
option.upscaling.value.fsr3=FSR 3
option.upscaling.value.xess=XeSS
option.upscaling.value.dlss=DLSS / DLAA
option.upscaling.default=off
option.upscaling.kept=true

option.renderScale.label=Render resolution
option.renderScale.tooltip=The size the world is drawn at against the screen's. Under 100%: fewer pixels, faster. \
  With TAA, the samples of many frames make the image at the screen's size; without it, FSR 1 brings the image up to \
  the screen and sharpens it; with resolution scaling on, its upscaler does. Over 100%: supersampling, every edge smoothed by four samples a pixel at 200%, at four \
  times the cost.
option.renderScale.values=33 43 50 59 67 77 100 141 200
option.renderScale.value.33=33% (Ultra Performance)
option.renderScale.value.43=43%
option.renderScale.value.50=50% (Performance)
option.renderScale.value.59=59% (Balanced)
option.renderScale.value.67=67% (Quality)
option.renderScale.value.77=77% (Ultra Quality)
option.renderScale.value.100=100% (Native)
option.renderScale.value.141=141% (SSAA 2x)
option.renderScale.value.200=200% (SSAA 4x)
option.renderScale.default=100
option.renderScale.kept=true

option.puddles.label=Puddles
option.puddles.tooltip=Wet ground and puddles in the rain.
option.puddles.default=true
option.puddles.preset.potato=false

option.rainDensity.label=Rain density
option.rainDensity.tooltip=How many raindrops, snowflakes and splashes are drawn, against the default. How hard it \
  rains is the game's.
option.rainDensity.values=25 50 75 100 150 200
option.rainDensity.default=100
option.rainDensity.preset.potato=50
option.rainDensity.preset.low=75

pipeline.shadows=${sunShadows}
pipeline.shadowResolution=${shadowResolution}
pipeline.shadowCascades=${shadowCascades}
pipeline.flashlightShadow=${flashlightShadow}
pipeline.lampShadows=${lampShadows}
pipeline.lampShadowResolution=${lampShadowResolution}
pipeline.headlightShadows=${headlightShadows}
pipeline.farShadows=${farShadows}
pipeline.farLamps=${farLamps}
pipeline.volumetrics=${volumetrics}
pipeline.clouds=${clouds}
pipeline.cloudResolution=${cloudResolution}
pipeline.cloudSteps=${cloudSteps}
pipeline.softClouds=${softClouds}
pipeline.occlusion=${occlusion}
pipeline.bounce=${bounceLight}
pipeline.bloom=${bloom}
pipeline.antialiasing=${antialiasing}
pipeline.upscaling=${upscaling}
pipeline.renderScale=${renderScale}
pipeline.puddles=${puddles}
pipeline.rainDensity=${rainDensity}
